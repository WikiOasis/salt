# mem: alert when MemAvailable drops below whichever is SMALLER, the absolute
# floor or the percentage of MemTotal:
#   warn below min(512MB, 10% of RAM), crit below min(256MB, 5% of RAM)
# So a 64GB host uses the 512MB/256MB floors, while a 1GB host scales down to
# ~102MB/~51MB instead of alerting while idle and healthy.
# Args: <warn_mb> <crit_mb> <warn_pct> <crit_pct>
command[check_mem]=/usr/lib/nagios/plugins/check_mem.sh 512 256 10 5
